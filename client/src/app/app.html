@if (showLayout()) {
  <div class="app-layout">
    <app-sidebar />
    <main class="main-content">
      <app-header
        [level]="userState.profile()?.level ?? 1"
        [currentXp]="userState.profile()?.currentXp ?? 0"
        [xpToNextLevel]="userState.profile()?.xpToNextLevel ?? 100"
        [coins]="userState.profile()?.coins ?? 0">
        {{ pageTitle.title() }}
      </app-header>
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
