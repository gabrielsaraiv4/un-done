<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-un">(un)</span><span class="logo-done">Done</span>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Start leveling up your productivity</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" name="username" placeholder="your_username" required />
      </div>

      <div class="form-field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-field">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </div>

      @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }

      @if (successMessage()) {
        <p class="success-message">{{ successMessage() }}</p>
      }

      <button type="submit" class="btn-submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Creating account...' : 'Sign up' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </div>
</div>
